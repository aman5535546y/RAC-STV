<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g fill="#D91B5C">
    <!-- 24 Gear Cogs -->
    <path d="M46 3 h8 l-1 8 h-6 z" transform="rotate(0 50 50)"/>
    <path d="M46 3 h8 l-1 8 h-6 z" transform="rotate(15 50 50)"/>
    <path d="M46 3 h8 l-1 8 h-6 z" transform="rotate(30 50 50)"/>
    <path d="M46 3 h8 l-1 8 h-6 z" transform="rotate(45 50 50)"/>
    <path d="M46 3 h8 l-1 8 h-6 z" transform="rotate(60 50 50)"/>
    <path d="M46 3 h8 l-1 8 h-6 z" transform="rotate(75 50 50)"/>
    <path d="M46 3 h8 l-1 8 h-6 z" transform="rotate(90 50 50)"/>
    <path d="M46 3 h8 l-1 8 h-6 z" transform="rotate(105 50 50)"/>
    <path d="M46 3 h8 l-1 8 h-6 z" transform="rotate(120 50 50)"/>
    <path d="M46 3 h8 l-1 8 h-6 z" transform="rotate(135 50 50)"/>
    <path d="M46 3 h8 l-1 8 h-6 z" transform="rotate(150 50 50)"/>
    <path d="M46 3 h8 l-1 8 h-6 z" transform="rotate(165 50 50)"/>
    <path d="M46 3 h8 l-1 8 h-6 z" transform="rotate(180 50 50)"/>
    <path d="M46 3 h8 l-1 8 h-6 z" transform="rotate(195 50 50)"/>
    <path d="M46 3 h8 l-1 8 h-6 z" transform="rotate(210 50 50)"/>
    <path d="M46 3 h8 l-1 8 h-6 z" transform="rotate(225 50 50)"/>
    <path d="M46 3 h8 l-1 8 h-6 z" transform="rotate(240 50 50)"/>
    <path d="M46 3 h8 l-1 8 h-6 z" transform="rotate(255 50 50)"/>
    <path d="M46 3 h8 l-1 8 h-6 z" transform="rotate(270 50 50)"/>
    <path d="M46 3 h8 l-1 8 h-6 z" transform="rotate(285 50 50)"/>
    <path d="M46 3 h8 l-1 8 h-6 z" transform="rotate(300 50 50)"/>
    <path d="M46 3 h8 l-1 8 h-6 z" transform="rotate(315 50 50)"/>
    <path d="M46 3 h8 l-1 8 h-6 z" transform="rotate(330 50 50)"/>
    <path d="M46 3 h8 l-1 8 h-6 z" transform="rotate(345 50 50)"/>

    <!-- Outer Solid Wheel Disc -->
    <circle cx="50" cy="50" r="42"/>
  </g>

  <!-- White Banner Ring Hole -->
  <circle cx="50" cy="50" r="34" fill="#FFFFFF"/>

  <!-- Inner Center Wheel Disc in Cranberry -->
  <circle cx="50" cy="50" r="23" fill="#D91B5C"/>

  <!-- Banners: ROTARY (Top) and INTERNATIONAL® (Bottom) -->
  <path id="topBannerArc" d="M 23 50 A 27 27 0 0 1 77 50" fill="none"/>
  <path id="bottomBannerArc" d="M 77 50 A 27 27 0 0 1 23 50" fill="none"/>

  <text fill="#D91B5C" font-family="'Outfit', 'Inter', 'Helvetica', sans-serif" font-weight="900" font-size="9.5" letter-spacing="1">
    <textPath href="#topBannerArc" startOffset="50%" text-anchor="middle">ROTARY</textPath>
  </text>
  <text fill="#D91B5C" font-family="'Outfit', 'Inter', 'Helvetica', sans-serif" font-weight="800" font-size="6.8" letter-spacing="0.4">
    <textPath href="#bottomBannerArc" startOffset="50%" text-anchor="middle">INTERNATIONAL®</textPath>
  </text>

  <!-- 6 White Spokes & Inner Axle Cutouts -->
  <g fill="#FFFFFF">
    <!-- Spoke Cutouts (6 wedge voids) -->
    <path d="M50 50 L38 31 A23 23 0 0 1 62 31 Z"/>
    <path d="M50 50 L62 31 A23 23 0 0 1 73 50 Z"/>
    <path d="M50 50 L73 50 A23 23 0 0 1 62 69 Z"/>
    <path d="M50 50 L62 69 A23 23 0 0 1 38 69 Z"/>
    <path d="M50 50 L38 69 A23 23 0 0 1 27 50 Z"/>
    <path d="M50 50 L27 50 A23 23 0 0 1 38 31 Z"/>
  </g>

  <!-- Re-draw Spoke Bars in Cranberry -->
  <g stroke="#D91B5C" stroke-width="4.2" stroke-linecap="square">
    <line x1="50" y1="50" x2="50" y2="27"/>
    <line x1="50" y1="50" x2="69.9" y2="38.5"/>
    <line x1="50" y1="50" x2="69.9" y2="61.5"/>
    <line x1="50" y1="50" x2="50" y2="73"/>
    <line x1="50" y1="50" x2="30.1" y2="61.5"/>
    <line x1="50" y1="50" x2="30.1" y2="38.5"/>
  </g>

  <!-- Center Axle Ring & Keyway Pin in Cranberry & White -->
  <circle cx="50" cy="50" r="9.5" fill="#D91B5C"/>
  <circle cx="50" cy="50" r="6" fill="#FFFFFF"/>
  <path d="M48 40.5 h4 v4 h-4 z" fill="#D91B5C"/>
  <circle cx="50" cy="50" r="4" fill="#D91B5C"/>
  <circle cx="50" cy="50" r="2.2" fill="#FFFFFF"/>
</svg>
